<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">HalaLoya intelligent petroleum soil monitoring concept</title>
<desc id="desc">Conceptual four-stage workflow: soil sample, nanosensor, AI analysis, and engineer-reviewed report. This is a research concept, not a validated device.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1725"/><stop offset="1" stop-color="#070b12"/></linearGradient>
 <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14283a"/><stop offset="1" stop-color="#0b1420"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55d6c2"/><stop offset="1" stop-color="#6f9dff"/></linearGradient>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#72b9d5"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/></filter>
</defs>
<rect width="1200" height="680" rx="28" fill="url(#bg)"/>
<circle cx="1030" cy="110" r="180" fill="#214d71" opacity=".12"/>
<circle cx="140" cy="590" r="210" fill="#1d7c73" opacity=".10"/>
<text x="600" y="58" text-anchor="middle" fill="#70d7ce" font-family="Arial,sans-serif" font-size="16" letter-spacing="4">HALALOYA · RESEARCH CONCEPT</text>
<text x="600" y="102" text-anchor="middle" fill="#f3f7fb" font-family="Arial,sans-serif" font-size="31" font-weight="700">Intelligent Petroleum Soil Monitoring</text>
<text x="600" y="134" text-anchor="middle" fill="#aab8c9" font-family="Arial,sans-serif" font-size="19">تصوّر بحثي لمراقبة التربة البترولية بالاستشعار والذكاء الاصطناعي</text>
<!-- flow arrows -->
<path d="M275 315 H315" stroke="#72b9d5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M555 315 H595" stroke="#72b9d5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M835 315 H875" stroke="#72b9d5" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<!-- card 1 -->
<g filter="url(#shadow)"><rect x="45" y="190" width="230" height="270" rx="20" fill="url(#node)" stroke="#2e5368" stroke-width="1.5"/></g>
<circle cx="160" cy="245" r="35" fill="#173c45" stroke="#55d6c2" stroke-width="1.5"/>
<path d="M142 228 L178 228 L172 250 Q160 263 148 250 Z" fill="none" stroke="#8ce8d9" stroke-width="3" stroke-linejoin="round"/>
<path d="M148 244 Q160 239 172 244 M151 250 Q160 247 169 250" stroke="#8ce8d9" stroke-width="2" fill="none"/>
<text x="160" y="310" text-anchor="middle" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">01 · Soil Sample</text>
<text x="160" y="340" text-anchor="middle" fill="#a9bbcb" font-family="Arial,sans-serif" font-size="18">عينة التربة</text>
<text x="160" y="385" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">Field sampling</text>
<text x="160" y="408" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">and site context</text>
<!-- card 2 -->
<g filter="url(#shadow)"><rect x="325" y="190" width="230" height="270" rx="20" fill="url(#node)" stroke="#2e5368" stroke-width="1.5"/></g>
<circle cx="440" cy="245" r="35" fill="#173c45" stroke="#55d6c2" stroke-width="1.5"/>
<g stroke="#8ce8d9" stroke-width="2.5" fill="none"><rect x="424" y="229" width="32" height="32" rx="5"/><path d="M432 222 V229 M440 222 V229 M448 222 V229 M432 261 V268 M440 261 V268 M448 261 V268 M417 237 H424 M417 245 H424 M417 253 H424 M456 237 H463 M456 245 H463 M456 253 H463"/><circle cx="440" cy="245" r="6"/></g>
<text x="440" y="310" text-anchor="middle" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">02 · Nanosensor</text>
<text x="440" y="340" text-anchor="middle" fill="#a9bbcb" font-family="Arial,sans-serif" font-size="18">مستشعر نانوي</text>
<text x="440" y="385" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">Potential chemical</text>
<text x="440" y="408" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">or environmental signals</text>
<!-- card 3 -->
<g filter="url(#shadow)"><rect x="605" y="190" width="230" height="270" rx="20" fill="url(#node)" stroke="#2e5368" stroke-width="1.5"/></g>
<circle cx="720" cy="245" r="35" fill="#202e54" stroke="#7fa7ff" stroke-width="1.5"/>
<g fill="none" stroke="#9dbaff" stroke-width="2.5"><path d="M699 252 L711 240 L720 248 L736 229"/><circle cx="699" cy="252" r="3" fill="#9dbaff"/><circle cx="711" cy="240" r="3" fill="#9dbaff"/><circle cx="720" cy="248" r="3" fill="#9dbaff"/><circle cx="736" cy="229" r="3" fill="#9dbaff"/><path d="M699 262 H740"/></g>
<text x="720" y="310" text-anchor="middle" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">03 · AI Analysis</text>
<text x="720" y="340" text-anchor="middle" fill="#a9bbcb" font-family="Arial,sans-serif" font-size="18">تحليل الذكاء الاصطناعي</text>
<text x="720" y="385" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">Clean data, assess</text>
<text x="720" y="408" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">patterns and uncertainty</text>
<!-- card 4 -->
<g filter="url(#shadow)"><rect x="885" y="190" width="270" height="270" rx="20" fill="url(#node)" stroke="#2e5368" stroke-width="1.5"/></g>
<circle cx="1020" cy="245" r="35" fill="#203a36" stroke="#74d6a2" stroke-width="1.5"/>
<path d="M1004 227 H1036 V261 H1004 Z M1011 236 H1029 M1011 243 H1029 M1011 250 H1023" stroke="#9ce8bb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="1020" y="310" text-anchor="middle" fill="#f5f7fb" font-family="Arial,sans-serif" font-size="21" font-weight="700">04 · Reviewed Report</text>
<text x="1020" y="340" text-anchor="middle" fill="#a9bbcb" font-family="Arial,sans-serif" font-size="18">تقرير يراجعه المختص</text>
<text x="1020" y="385" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">Decision support</text>
<text x="1020" y="408" text-anchor="middle" fill="#c1ccda" font-family="Arial,sans-serif" font-size="14">with expert oversight</text>
<!-- footer -->
<rect x="100" y="500" width="1000" height="105" rx="16" fill="#0b111a" stroke="#26394a"/>
<rect x="100" y="500" width="5" height="105" rx="2" fill="url(#accent)"/>
<text x="130" y="536" fill="#70d7ce" font-family="Arial,sans-serif" font-size="16" font-weight="700">VALIDATION GATE · بوابة التحقق العلمي</text>
<text x="130" y="565" fill="#d4deea" font-family="Arial,sans-serif" font-size="15">Sensor selection, calibration, field trials and reference-lab comparisons are required.</text>
<text x="130" y="588" fill="#aab8c9" font-family="Arial,sans-serif" font-size="15">اختيار المستشعرات ومعايرتها والاختبارات الميدانية والمقارنة بالمعامل المرجعية ضرورية.</text>
<text x="600" y="642" text-anchor="middle" fill="#8594a7" font-family="Arial,sans-serif" font-size="13">Conceptual workflow only · Not a validated prototype or a claim of measured performance</text>
</svg>